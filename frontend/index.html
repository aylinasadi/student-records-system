<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Records | Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            background: #1e293b;
            padding: 2.5rem;
            border-radius: 16px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.4);
        }

        h1 {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 0.3rem;
            color: #f8fafc;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }

        .tabs {
            display: flex;
            background: #0f172a;
            border-radius: 10px;
            padding: 4px;
            margin-bottom: 1.8rem;
        }

        .tab {
            flex: 1;
            padding: 0.6rem;
            text-align: center;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            color: #94a3b8;
            transition: all 0.2s;
        }

        .tab.active {
            background: #3b82f6;
            color: white;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 0.4rem;
        }

        input {
            width: 100%;
            padding: 0.75rem 1rem;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #f8fafc;
            font-size: 0.95rem;
            outline: none;
            transition: border 0.2s;
        }

        input:focus {
            border-color: #3b82f6;
        }

        button {
            width: 100%;
            padding: 0.8rem;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 0.5rem;
            transition: background 0.2s;
        }

        button:hover {
            background: #2563eb;
        }

        .error {
            background: #7f1d1d;
            color: #fca5a5;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-bottom: 1rem;
            display: none;
        }

        .success {
            background: #14532d;
            color: #86efac;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-bottom: 1rem;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Student Records</h1>
        <p class="subtitle">Teacher portal — sign in to continue</p>

        <div class="tabs">
            <div class="tab active" onclick="switchTab('login')">Login</div>
            <div class="tab" onclick="switchTab('signup')">Sign Up</div>
        </div>

        <div id="error" class="error"></div>
        <div id="success" class="success"></div>

        <!-- Login Form -->
        <div id="login-form">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="login-email" placeholder="you@school.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="login-password" placeholder="••••••••">
            </div>
            <button onclick="login()">Login</button>
        </div>

        <!-- Signup Form -->
        <div id="signup-form" style="display:none">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="signup-name" placeholder="Mr. Smith">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="signup-email" placeholder="you@school.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="signup-password" placeholder="••••••••">
            </div>
            <button onclick="signup()">Create Account</button>
        </div>
    </div>

    <script>
        const API = "http://localhost:8000"

        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'))
            event.target.classList.add('active')
            document.getElementById('login-form').style.display = tab === 'login' ? 'block' : 'none'
            document.getElementById('signup-form').style.display = tab === 'signup' ? 'block' : 'none'
            hideMessages()
        }

        function showError(msg) {
            const el = document.getElementById('error')
            el.textContent = msg
            el.style.display = 'block'
            document.getElementById('success').style.display = 'none'
        }

        function showSuccess(msg) {
            const el = document.getElementById('success')
            el.textContent = msg
            el.style.display = 'block'
            document.getElementById('error').style.display = 'none'
        }

        function hideMessages() {
            document.getElementById('error').style.display = 'none'
            document.getElementById('success').style.display = 'none'
        }

        async function login() {
            const email = document.getElementById('login-email').value
            const password = document.getElementById('login-password').value

            if (!email || !password) return showError('please fill in all fields')

            try {
                const res = await fetch(`${API}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                })

                const data = await res.json()
                if (!res.ok) return showError(data.detail || 'login failed')

                localStorage.setItem('token', data.access_token)
                window.location.href = 'dashboard.html'

            } catch (err) {
                showError('could not connect to server')
            }
        }

        async function signup() {
            const name = document.getElementById('signup-name').value
            const email = document.getElementById('signup-email').value
            const password = document.getElementById('signup-password').value

            if (!name || !email || !password) return showError('please fill in all fields')

            try {
                const res = await fetch(`${API}/auth/signup`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password })
                })

                const data = await res.json()
                if (!res.ok) return showError(data.detail || 'signup failed')

                showSuccess('account created! you can now log in')
                switchTab('login')

            } catch (err) {
                showError('could not connect to server')
            }
        }

        // redirect if already logged in
        if (localStorage.getItem('token')) {
            window.location.href = 'dashboard.html'
        }
    </script>
</body>
</html>
